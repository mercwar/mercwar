<!-- CVBGOD TEXT with clarity pulse -->
<g>
  <!-- Blur filter for clarity effect -->
  <filter id="cvbBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0" result="blur">
      <animate attributeName="stdDeviation"
               values="0;3;0"
               dur="4s"
               repeatCount="indefinite"/>
    </feGaussianBlur>
  </filter>

  <!-- Glow pulse -->
  <filter id="cvbGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="g"/>
    <feColorMatrix in="g" type="matrix"
      values="0 0 0 0 0.4
              0 0 0 0 0.9
              0 0 0 0 1
              0 0 0 0.8 0"/>
  </filter>

  <!-- Animated CVBGOD text -->
  <text x="400" y="135"
        text-anchor="middle"
        font-family="Eurostile, Orbitron, system-ui"
        font-size="46"
        fill="#e6f7ff"
        letter-spacing="6"
        filter="url(#cvbBlur)">
    CVBGOD
    <animate attributeName="opacity"
             values="1;0.4;1"
             dur="4s"
             repeatCount="indefinite"/>
  </text>

  <!-- Glow layer (subtle pulse) -->
  <text x="400" y="135"
        text-anchor="middle"
        font-family="Eurostile, Orbitron, system-ui"
        font-size="46"
        fill="#00eaff"
        letter-spacing="6"
        opacity="0.4"
        filter="url(#cvbGlow)">
    CVBGOD
    <animate attributeName="opacity"
             values="0.2;0.8;0.2"
             dur="4s"
             repeatCount="indefinite"/>
  </text>
</g>
