<svg width="1000" height="600" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">

    <!-- Cybernetic Ambient Glow -->
    <rect x="0" y="0" width="1000" height="600" rx="20"
          fill="none" stroke="#00f2ff" stroke-width="15" stroke-opacity="0.05"/>

    <!-- Primary Holographic Command Window -->
    <rect x="10" y="10" width="980" height="580" rx="15"
          fill="#05060a" fill-opacity="0.85" stroke="#00f2ff" stroke-width="2"/>

    <!-- Square Resize Corners -->
    <g fill="#00f2ff">
        <rect x="10" y="10" width="10" height="10"/>
        <rect x="990" y="10" width="10" height="10"/>
        <rect x="10" y="580" width="10" height="10"/>
        <rect x="990" y="580" width="10" height="10"/>
    </g>

    <!-- Tactical Navigation Grid -->
    <g stroke="#00f2ff" stroke-width="0.5" stroke-opacity="0.15">
        <line x1="20" y1="10" x2="20" y2="590"/>
        <line x1="140" y1="10" x2="140" y2="590"/>
        <line x1="260" y1="10" x2="260" y2="590"/>
        <line x1="380" y1="10" x2="380" y2="590"/>
        <line x1="500" y1="10" x2="500" y2="590"/>
        <line x1="620" y1="10" x2="620" y2="590"/>
        <line x1="740" y1="10" x2="740" y2="590"/>
        <line x1="860" y1="10" x2="860" y2="590"/>

        <line x1="10" y1="20" x2="990" y2="20"/>
        <line x1="10" y1="140" x2="990" y2="140"/>
        <line x1="10" y1="260" x2="990" y2="260"/>
        <line x1="10" y1="380" x2="990" y2="380"/>
        <line x1="10" y1="500" x2="990" y2="500"/>
    </g>

    <!-- Heavy Mechanical Corner Reinforcements -->
    <g fill="none" stroke="#00f2ff" stroke-width="6">
        <path d="M 10 120 L 10 10 L 120 10"/>
        <path d="M 880 10 L 990 10 L 990 120"/>
        <path d="M 990 480 L 990 590 L 880 590"/>
        <path d="M 120 590 L 10 590 L 10 480"/>
    </g>

    <!-- AVIS System Readouts -->
    <g font-family="monospace" font-weight="bold">
        <rect x="30" y="30" width="210" height="16" fill="#00f2ff" fill-opacity="0.5"/>
        <text x="35" y="42" font-size="10" fill="#000000">DISCOVERY_STREAM_V1.1</text>

        <text x="660" y="45" font-size="14" fill="#00f2ff">SYSTEM: [ACTIVE]</text>
        <text x="660" y="65" font-size="11" fill="#00f2ff" fill-opacity="0.7">AVIS_COORD: 1.1.CVBGOD</text>
    </g>

    <!-- High-Frequency Scanline Texture -->
    <g stroke="#00f2ff" stroke-width="0.5" stroke-opacity="0.08">
        <line x1="10" y1="15" x2="990" y2="15"/>
        <line x1="10" y1="25" x2="990" y2="25"/>
        <line x1="10" y1="35" x2="990" y2="35"/>
        <line x1="10" y1="575" x2="990" y2="575"/>
    </g>

    <!-- LEFT NAV PANEL -->
    <rect x="30" y="90" width="220" height="460" rx="10"
          fill="#05060f" fill-opacity="0.95"
          stroke="#00f2ff" stroke-width="1" stroke-opacity="0.6"/>

    <!-- LEFT NAV CONTENT -->
    <g font-family="monospace" font-weight="bold">
        <text x="45" y="115" font-size="12" fill="#00f2ff">RKU.DX_MODULES</text>

        <text x="45" y="145" font-size="11" fill="#f5f5f5">▸ loader.avs.core</text>
        <text x="45" y="165" font-size="11" fill="#f5f5f5" fill-opacity="0.7">▹ loader.avs.fsindex</text>
        <text x="45" y="185" font-size="11" fill="#f5f5f5" fill-opacity="0.7">▹ loader.avs.dotproto</text>
        <text x="45" y="205" font-size="11" fill="#f5f5f5" fill-opacity="0.7">▹ loader.avs.chain</text>

        <text x="45" y="235" font-size="11" fill="#00f2ff">▸ dx.pipeline</text>
        <text x="60" y="255" font-size="10" fill="#f5f5f5">- compile.rku</text>
        <text x="60" y="272" font-size="10" fill="#f5f5f5">- test.rku</text>
        <text x="60" y="289" font-size="10" fill="#f5f5f5">- ship.rku</text>

        <text x="45" y="320" font-size="11" fill="#00f2ff">▸ observability</text>
        <text x="60" y="340" font-size="10" fill="#f5f5f5">- traces</text>
        <text x="60" y="357" font-size="10" fill="#f5f5f5">- metrics</text>
        <text x="60" y="374" font-size="10" fill="#f5f5f5">- logs</text>

        <text x="45" y="405" font-size="11" fill="#00f2ff">▸ avis.law</text>
        <text x="60" y="425" font-size="10" fill="#f5f5f5">- dot.protocol</text>
        <text x="60" y="442" font-size="10" fill="#f5f5f5">- chain.of.resp</text>
        <text x="60" y="459" font-size="10" fill="#f5f5f5">- block.routing</text>

        <text x="45" y="490" font-size="11" fill="#00f2ff">▸ profiles</text>
        <text x="60" y="510" font-size="10" fill="#f5f5f5">- rku.local</text>
        <text x="60" y="527" font-size="10" fill="#f5f5f5">- ci.github</text>
        <text x="60" y="544" font-size="10" fill="#f5f5f5">- prod.cluster</text>
    </g>

    <!-- MAIN CONSOLE PANEL -->
    <rect x="270" y="90" width="460" height="260" rx="10"
          fill="#05060c" fill-opacity="0.98"
          stroke="#00f2ff" stroke-width="1" stroke-opacity="0.6"/>

    <!-- MAIN CONSOLE HEADER -->
    <g font-family="monospace" font-weight="bold">
        <text x="285" y="110" font-size="12" fill="#00f2ff">DX.CONSOLE :: RKU_CHAIN_OF_RESP</text>
        <text x="285" y="126" font-size="10" fill="#00f2ff" fill-opacity="0.7">shell: msys2/ucrt64 | mode: strict</text>
    </g>

    <!-- MAIN CONSOLE CONTENT -->
    <g font-family="monospace" font-size="10" fill="#e8e8e8">
        <text x="285" y="146">$ avis-rku dx run --profile=ci.github --pipeline=chain</text>
        <text x="285" y="162" fill="#00ff99">[OK] bootstrap: msys2/ucrt64 detected</text>
        <text x="285" y="176" fill="#00ff99">[OK] loader: pure chain-of-responsibility mode</text>
        <text x="285" y="190" fill="#00ff99">[OK] dot-protocol: AVIS2026 law enforced</text>
        <text x="285" y="204" fill="#ffdd55">[DX] routing: SPEC blocks discovered: 12</text>
        <text x="285" y="218" fill="#ffdd55">[DX] registry: CLASS/REG bindings validated</text>
        <text x="285" y="232" fill="#ffdd55">[WARN] fsindex: 2 legacy paths mapped via shim</text>
        <text x="285" y="246" fill="#ffdd55">[WARN] dotproto: 1 token stream normalized</text>
        <text x="285" y="260" fill="#00ff99">[OK] build: 142 modules compiled (0 failed)</text>
        <text x="285" y="274" fill="#00ff99">[OK] tests: 389 specs, 389 passed, 0 skipped</text>
    </g>

    <!-- SPEC SNIPPET -->
    <g font-family="monospace" font-size="10" fill="#9ad9ff">
        <text x="300" y="304">BEGIN.SPEC.CHAIN loader.avs.core</text>
        <text x="315" y="318">&gt; token.level: ROOT</text>
        <text x="315" y="332">&gt; dispatch: chain.of.responsibility</text>
        <text x="300" y="344">END.SPEC.CHAIN</text>
        <text x="285" y="386" fill="#e8e8e8">$ avis-rku dx ship --target=prod.cluster --law=AVIS2026</text>
        <text x="285" y="400" fill="#00ff99">[OK] release: CVBGOD-2026.05.02-01 promoted</text>
    </g>

    <!-- RIGHT METRICS PANEL -->
    <rect x="750" y="90" width="220" height="260" rx="10"
          fill="#05060f" fill-opacity="0.97"
          stroke="#00f2ff" stroke-width="1" stroke-opacity="0.6"/>

    <!-- RIGHT METRICS HEADER -->
    <g font-family="monospace" font-weight="bold">
        <text x="765" y="110" font-size="12" fill="#00f2ff">RKU.METRICS :: LIVE</text>
    </g>

    <!-- METRIC BLOCKS -->
    <g font-family="monospace" font-size="10">
        <rect x="765" y="125" width="90" height="60" rx="8"
