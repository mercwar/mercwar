<svg width="1000" height="600" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">

    <!-- Primary Holographic Command Window -->
    <rect x="0" y="0" width="980" height="580" rx="15"
          fill="#05060a" fill-opacity="0.85" stroke="#00f2ff" stroke-width="2"/>

    <!-- Square Resize Corners -->
    <g fill="#00f2ff">
        <rect x="0" y="0" width="10" height="10"/>
        <rect x="970" y="0" width="10" height="10"/>
        <rect x="0" y="570" width="10" height="10"/>
        <rect x="970" y="570" width="10" height="10"/>
    </g>

    <!-- Tactical Navigation Grid -->
    <g stroke="#00f2ff" stroke-width="0.5" stroke-opacity="0.15">
        <line x1="10" y1="0" x2="10" y2="580"/>
        <line x1="130" y1="0" x2="130" y2="580"/>
        <line x1="250" y1="0" x2="250" y2="580"/>
        <line x1="370" y1="0" x2="370" y2="580"/>
        <line x1="490" y1="0" x2="490" y2="580"/>
        <line x1="610" y1="0" x2="610" y2="580"/>
        <line x1="730" y1="0" x2="730" y2="580"/>
        <line x1="850" y1="0" x2="850" y2="580"/>

        <line x1="0" y1="10" x2="980" y2="10"/>
        <line x1="0" y1="130" x2="980" y2="130"/>
        <line x1="0" y1="250" x2="980" y2="250"/>
        <line x1="0" y1="370" x2="980" y2="370"/>
        <line x1="0" y1="490" x2="980" y2="490"/>
    </g>

    <!-- Heavy Mechanical Corner Reinforcements -->
    <g fill="none" stroke="#00f2ff" stroke-width="6">
        <path d="M 0 110 L 0 0 L 110 0"/>
        <path d="M 870 0 L 980 0 L 980 110"/>
        <path d="M 980 470 L 980 580 L 870 580"/>
        <path d="M 110 580 L 0 580 L 0 470"/>
    </g>

    <!-- AVIS System Readouts -->
    <g font-family="monospace" font-weight="bold">
        <rect x="20" y="20" width="210" height="16" fill="#00f2ff" fill-opacity="0.5"/>
        <text x="25" y="32" font-size="10" fill="#000000">DISCOVERY_STREAM_V1.1</text>

        <text x="650" y="35" font-size="14" fill="#00f2ff">SYSTEM: [ACTIVE]</text>
        <text x="650" y="55" font-size="11" fill="#00f2ff" fill-opacity="0.7">AVIS_COORD: 1.1.CVBGOD</text>
    </g>

    <!-- High-Frequency Scanline Texture -->
    <g stroke="#00f2ff" stroke-width="0.5" stroke-opacity="0.08">
        <line x1="0" y1="5" x2="980" y2="5"/>
        <line x1="0" y1="15" x2="980" y2="15"/>
        <line x1="0" y1="25" x2="980" y2="25"/>
        <line x1="0" y1="565" x2="980" y2="565"/>
    </g>

    <!-- LEFT NAV PANEL -->
    <rect x="20" y="80" width="220" height="460" rx="10"
          fill="#05060f" fill-opacity="0.95"
          stroke="#00f2ff" stroke-width="1" stroke-opacity="0.6"/>

    <!-- LEFT NAV CONTENT -->
    <g font-family="monospace" font-weight="bold">
        <text x="35" y="105" font-size="12" fill="#00f2ff">RKU.DX_MODULES</text>

        <text x="35" y="135" font-size="11" fill="#f5f5f5">▸ loader.avs.core</text>
        <text x="35" y="155" font-size="11" fill="#f5f5f5" fill-opacity="0.7">▹ loader.avs.fsindex</text>
        <text x="35" y="175" font-size="11" fill="#f5f5f5" fill-opacity="0.7">▹ loader.avs.dotproto</text>
        <text x="35" y="195" font-size="11" fill="#f5f5f5" fill-opacity="0.7">▹ loader.avs.chain</text>

        <text x="35" y="225" font-size="11" fill="#00f2ff">▸ dx.pipeline</text>
        <text x="50" y="245" font-size="10" fill="#f5f5f5">- compile.rku</text>
        <text x="50" y="262" font-size="10" fill="#f5f5f5">- test.rku</text>
        <text x="50" y="279" font-size="10" fill="#f5f5f5">- ship.rku</text>

        <text x="35" y="310" font-size="11" fill="#00f2ff">▸ observability</text>
        <text x="50" y="330" font-size="10" fill="#f5f5f5">- traces</text>
        <text x="50" y="347" font-size="10" fill="#f5f5f5">- metrics</text>
        <text x="50" y="364" font-size="10" fill="#f5f5f5">- logs</text>

        <text x="35" y="395" font-size="11" fill="#00f2ff">▸ avis.law</text>
        <text x="50" y="415" font-size="10" fill="#f5f5f5">- dot.protocol</text>
        <text x="50" y="432" font-size="10" fill="#f5f5f5">- chain.of.resp</text>
        <text x="50" y="449" font-size="10" fill="#f5f5f5">- block.routing</text>

        <text x="35" y="480" font-size="11" fill="#00f2ff">▸ profiles</text>
        <text x="50" y="500" font-size="10" fill="#f5f5f5">- rku.local</text>
        <text x="50" y="517" font-size="10" fill="#f5f5f5">- ci.github</text>
        <text x="50" y="534" font-size="10" fill="#f5f5f5">- prod.cluster</text>
    </g>

    <!-- MAIN CONSOLE PANEL -->
    <rect x="260" y="80" width="460" height="260" rx="10"
          fill="#05060c" fill-opacity="0.98"
          stroke="#00f2ff" stroke-width="1" stroke-opacity="0.6"/>

    <!-- MAIN CONSOLE HEADER -->
    <g font-family="monospace" font-weight="bold">
        <text x="275" y="100" font-size="12" fill="#00f2ff">DX.CONSOLE :: RKU_CHAIN_OF_RESP</text>
        <text x="275" y="116" font-size="10" fill="#00f2ff" fill-opacity="0.7">shell: msys2/ucrt64 | mode: strict</text>
    </g>

    <!-- MAIN CONSOLE CONTENT -->
    <g font-family="monospace" font-size="10" fill="#e8e8e8">
        <text x="275" y="136">$ avis-rku dx run --profile=ci.github --pipeline=chain</text>
        <text x="275" y="152" fill="#00ff99">[OK] bootstrap: msys2/ucrt64 detected</text>
        <text x="275" y="166" fill="#00ff99">[OK] loader: pure chain-of-responsibility mode</text>
        <text x="275" y="180" fill="#00ff99">[OK] dot-protocol: AVIS2026 law enforced</text>
        <text x="275" y="194" fill="#ffdd55">[DX] routing: SPEC blocks discovered: 12</text>
        <text x="275" y="208" fill="#ffdd55">[DX] registry: CLASS/REG bindings validated</text>
        <text x="275" y="222" fill="#ffdd55">[WARN] fsindex: 2 legacy paths mapped via shim</text>
        <text x="275" y="236" fill="#ffdd55">[WARN] dotproto: 1 token stream normalized</text>
        <text x="275" y="250" fill="#00ff99">[OK] build: 142 modules compiled (0 failed)</text>
        <text x="275" y="264" fill="#00ff99">[OK] tests: 389 specs, 389 passed, 0 skipped</text>
    </g>

    <!-- SPEC SNIPPET -->
    <g font-family="monospace" font-size="10" fill="#9ad9ff">
        <text x="290" y="294">BEGIN.SPEC.CHAIN loader.avs.core</text>
        <text x="305" y="308">&gt; token.level: ROOT</text>
        <text x="305" y="322">&gt; dispatch: chain.of.responsibility</text>
        <text x="290" y="334">END.SPEC.CHAIN</text>
        <text x="275" y="376" fill="#e8e8e8">$ avis-rku dx ship --target=prod.cluster --law=AVIS2026</text>
        <text x="275" y="390" fill="#00ff99">[OK] release: CVBGOD-2026.05.02-01 promoted</text>
    </g>

    <!-- RIGHT METRICS PANEL -->
    <rect x="740" y="80" width="220" height="260" rx="10"
          fill="#05060f" fill-opacity="0.97"
          stroke="#00f2ff" stroke-width="1" stroke-opacity="0.6"/>

    <!-- RIGHT METRICS HEADER -->
    <g font-family="monospace" font-weight="bold">
        <text x="755" y="100" font-size="12" fill="#00f2ff">RKU.METRICS :: LIVE</text>
    </g>

    <!-- METRIC BLOCKS -->
    <g font-family="monospace" font-size="10">
        <rect x="755" y="115" width="90" height="60" rx="8"
              fill="#05060c" stroke="#00f2ff" stroke-width="1"/>
        <text x="762" y="130" fill="#ffdd55">BUILD.TIME</text>
        <text x="762" y="146" fill="#e8e8e8">avg: 18.4s</text>
        <text x="762" y="160" fill="#9ad9ff">p95: 24.1s</text>

        <rect x="855" y="115" width="90" height="60" rx="8"
              fill="#05060c" stroke="#00f2ff" stroke-width="1"/>
        <text x="862" y="130" fill="#ffdd55">TEST.COVER</text>
        <text x="862" y="146" fill="#e8e8e8">line: 97.3%</text>
        <text x="862" y="160" fill="#9ad9ff">branch: 93.8%</text>

        <rect x="755" y="185" width="90" height="60" rx="8"
              fill="#05060c" stroke="#00f2ff" stroke-width="1"/>
        <text x="762" y="200" fill="#ffdd55">PIPELINE</text>
        <text x="762" y="216" fill="#00ff99">green (12/12)</text>
        <text x="762" y="230" fill="#9ad9ff">last fail: 0d</text>

        <rect x="855" y="185" width="90" height="60" rx="8"
              fill="#05060c" stroke="#00f2ff" stroke-width="1"/>
        <text x="862" y="200" fill="#ffdd55">LATENCY</text>
        <text x="862" y="216" fill="#e8e8e8">p50: 11ms</text>
        <text x="862" y="230" fill="#9ad9ff">p99: 61ms</text>

        <rect x="755" y="255" width="190" height="70" rx="8"
              fill="#05060c" stroke="#00f2ff" stroke-width="1"/>
        <text x="762" y="270" fill="#ffdd55">LAW.ENFORCEMENT</text>
        <text x="762" y="286" fill="#e8e8e8">AVIS2026.dot-protocol: STRICT</text>
        <text x="762" y="300" fill="#e8e8e8">chain.of.responsibility: PURE</text>
        <text x="762" y="314" fill="#e8e8e8">fsindex: INDEX-ONLY</text>
    </g>

    <!-- BOTTOM TIMELINE PANEL -->
    <rect x="260" y="360" width="700" height="200" rx="10"
          fill="#05060c" stroke="#00f2ff" stroke-width="1"/>

    <!-- TIMELINE HEADER -->
    <g font-family="monospace" font-weight="bold">
        <text x="275" y="382" font-size="12" fill="#ffdd55">RKU.DX_TIMELINE :: LAST 6 EVENTS</text>
    </g>

    <!-- TIMELINE EVENTS -->
    <g font-family="monospace" font-size="10">
        <line x1="275" y1="405" x2="935" y2="405" stroke="#00f2ff" stroke-width="1" stroke-opacity="0.4"/>

        <text x="285" y="425" fill="#e8e8e8">T-25m :: build.rku :: SUCCESS</text>
        <text x="285" y="445" fill="#e8e8e8">T-18m :: test.rku :: SUCCESS</text>
        <text x="285" y="465" fill="#e8e8e8">T-12m :: ship.rku :: SUCCESS</text>
        <text x="285" y="485" fill="#ffdd55">T-09m :: law.check :: 2 WARN (shimmed)</text>
        <text x="285" y="505" fill="#00ff99">T-04m :: observability.sync :: OK</text>
        <text x="285" y="525" fill="#00f2ff">T-01m :: dx.snapshot :: CAPTURED</text>
    </g>

</svg>
