        <text x="772" y="140" fill="#ffdd55">BUILD.TIME</text>
        <text x="772" y="156" fill="#e8e8e8">avg: 18.4s</text>
        <text x="772" y="170" fill="#9ad9ff">p95: 24.1s</text>

        <rect x="865" y="125" width="90" height="60" rx="8"
              fill="#05060c" stroke="#00f2ff" stroke-width="1"/>
        <text x="872" y="140" fill="#ffdd55">TEST.COVER</text>
        <text x="872" y="156" fill="#e8e8e8">line: 97.3%</text>
        <text x="872" y="170" fill="#9ad9ff">branch: 93.8%</text>

        <rect x="765" y="195" width="90" height="60" rx="8"
              fill="#05060c" stroke="#00f2ff" stroke-width="1"/>
        <text x="772" y="210" fill="#ffdd55">PIPELINE</text>
        <text x="772" y="226" fill="#00ff99">green (12/12)</text>
        <text x="772" y="240" fill="#9ad9ff">last fail: 0d</text>

        <rect x="865" y="195" width="90" height="60" rx="8"
              fill="#05060c" stroke="#00f2ff" stroke-width="1"/>
        <text x="872" y="210" fill="#ffdd55">LATENCY</text>
        <text x="872" y="226" fill="#e8e8e8">p50: 11ms</text>
        <text x="872" y="240" fill="#9ad9ff">p99: 61ms</text>

        <rect x="765" y="265" width="190" height="70" rx="8"
              fill="#05060c" stroke="#00f2ff" stroke-width="1"/>
        <text x="772" y="280" fill="#ffdd55">LAW.ENFORCEMENT</text>
        <text x="772" y="296" fill="#e8e8e8">AVIS2026.dot-protocol: STRICT</text>
        <text x="772" y="310" fill="#e8e8e8">chain.of.responsibility: PURE</text>
        <text x="772" y="324" fill="#e8e8e8">fsindex: INDEX-ONLY</text>
    </g>

    <!-- BOTTOM TIMELINE PANEL -->
    <rect x="270" y="370" width="700" height="200" rx="10"
          fill="#05060c" stroke="#00f2ff" stroke-width="1"/>

    <!-- TIMELINE HEADER -->
    <g font-family="monospace" font-weight="bold">
        <text x="285" y="392" font-size="12" fill="#ffdd55">RKU.DX_TIMELINE :: LAST 6 EVENTS</text>
    </g>

    <!-- TIMELINE EVENTS -->
    <g font-family="monospace" font-size="10">
        <line x1="285" y1="415" x2="945" y2="415" stroke="#00f2ff" stroke-width="1" stroke-opacity="0.4"/>

        <text x="295" y="435" fill="#e8e8e8">T-25m :: build.rku :: SUCCESS</text>
        <text x="295" y="455" fill="#e8e8e8">T-18m :: test.rku :: SUCCESS</text>
        <text x="295" y="475" fill="#e8e8e8">T-12m :: ship.rku :: SUCCESS</text>
        <text x="295" y="495" fill="#ffdd55">T-09m :: law.check :: 2 WARN (shimmed)</text>
        <text x="295" y="515" fill="#00ff99">T-04m :: observability.sync :: OK</text>
        <text x="295" y="535" fill="#00f2ff">T-01m :: dx.snapshot :: CAPTURED</text>
    </g>

</svg>
