name: "MERCWAR :: SITE-MAP-DISPATCH"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'sitemap.xml'
  workflow_dispatch:

jobs:
  sentinel-dispatch:
    name: "MERCWAR :: Sentinel Dispatch"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "MERCWAR :: Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: "MERCWAR :: Repair Submodule Mapping"
        run: |
          if [ -d "AVIS-DATALAKE" ] || git ls-files --stage | grep -q "^160000.*AVIS-DATALAKE$"; then
            git config -f .gitmodules submodule.AVIS-DATALAKE.path AVIS-DATALAKE
            git config -f .gitmodules submodule.AVIS-DATALAKE.url https://github.com
            git submodule sync
          fi

      - name: "MERCWAR :: Execute Sitemap Script"
        run: |
          cd "${GITHUB_WORKSPACE}"

          if [ -f "./fire-site.sh" ]; then
            chmod +x ./fire-site.sh
            ./fire-site.sh
          else
            echo "::error::MERCWAR FATAL: fire-site.sh NOT FOUND at $(pwd)"
            ls -la
            exit 1
          fi

      - name: "MERCWAR :: Commit & Push"
        run: |
          git config user.name "MERCWAR-Automaton"
          git config user.email "mercwar@github.local"

          git add sitemap.xml
          if [ -f ".gitmodules" ]; then
            git add .gitmodules
          fi

          if ! git diff --staged --quiet; then
            git commit -m "MERCWAR: Automated sitemap & submodule mapping update [skip ci]"
            git push
          else
            echo "MERCWAR: No changes to commit."
          fi
